# SMOKE_TEST configuration (3 epochs, 5-fold participant-level CV).
# Subdirectory names verified against the extracted data on 2026-10-25.
run_label: "SMOKE_TEST"

paths:
  project_root: "E:/ASD Project"
  dataset_root: "E:/ASD Project/Dataset"
  mmasd: "E:/ASD Project/Dataset/MMASD"
  move4as: "E:/ASD Project/Dataset/Move4AS"
  questionnaire: "E:/ASD Project/Dataset/Questionnaire"
  processed: "E:/ASD Project/data/processed"
  audit: "E:/ASD Project/outputs/audit"
  checkpoints: "E:/ASD Project/outputs/checkpoints"
  predictions: "E:/ASD Project/outputs/predictions"
  metrics: "E:/ASD Project/outputs/metrics"
  plots: "E:/ASD Project/outputs/plots"
  logs: "E:/ASD Project/outputs/logs"
  reports: "E:/ASD Project/outputs/reports"

# Original archives as found in dataset_root (never modified).
raw_archives:
  move4as: "28296518.zip"
  mmasd_parts:
    - "drive-download-20261023T064244Z-1-002.zip"
    - "drive-download-20261023T064244Z-1-003.zip"
    - "drive-download-20261023T064244Z-1-004.zip"
  mmasd_optical_flow: "optical_flow-001.zip"
  questionnaire: "autism-screening-for-toddlers-data.zip"

experiment:
  random_seed: 42
  n_splits: 5
  epochs: 3
  batch_size: 8
  num_workers: 0
  max_sequence_length: 128
  early_stopping: false

training:
  learning_rate: 0.0001
  weight_decay: 0.0001
  evaluate_each_epoch: true
  save_checkpoints: true
  mixed_precision: true   # RTX 4060 Laptop (8 GB): AMP enabled on CUDA, ignored on CPU
  inner_val_fraction: 0.2 # participants held out of each training fold for threshold/weight selection

move4as:
  positive_class: "ASD"   # P* = autistic (label 1), S* = neurotypical control (label 0)
  eeg_sfreq: 250
  eeg_band_hz: [1.0, 45.0]
  eeg_window_s: 4.0       # execution period length (README: 4-second execution)
  motion_fps: null        # read from file metadata during preprocessing

mae:
  lr: 0.001             # pre-training LR (self-supervised, batch 32); fine-tuning uses training.learning_rate
  mask_ratio: 0.5
  embed_dim: 128
  depth: 4
  heads: 4
